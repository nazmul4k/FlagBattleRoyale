name: Build Flag Battle Royale APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:
- name: Checkout repository
uses: actions/checkout@v4

- name: Set up Java 17
uses: actions/setup-java@v4
with:
distribution: temurin
java-version: '17'

- name: Set up Gradle
uses: gradle/actions/setup-gradle@v4
with:
gradle-version: '8.11.1'

- name: Extract Android project
run: |
mkdir android-project
unzip -q *.zip -d android-project
PROJECT_DIR=$(dirname "$(find android-project -name settings.gradle -o -name settings.gradle.kts | head -n 1)")
echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

- name: Build Debug APK
run: gradle -p "$PROJECT_DIR" assembleDebug

- name: Upload APK
uses: actions/upload-artifact@v4
with:
name: Flag-Battle-Royale-APK
path: android-project/**/app/build/outputs/apk/debug/*.apk
