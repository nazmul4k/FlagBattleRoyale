name: Build Flag Battle Royale APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q "FlagBattleRoyale_AndroidStudio_Project[1].zip" -d project

      - name: Find project and build APK
        run: |
          SETTINGS=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Project directory: $PROJECT_DIR"
          gradle -p "$PROJECT_DIR" assembleDebug
          echo "APK files:"
          find project -type f -name "*.apk" -print

      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: Flag-Battle-Royale-APK
          path: project/**/*.apk
          if-no-files-found: error
