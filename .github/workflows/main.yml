name: Build Flag Battle Royale APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q "FlagBattleRoyale_AndroidStudio_Project[1].zip" -d project

      - name: Build APKs
        run: |
          SETTINGS=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          PROJECT_DIR=$(dirname "$SETTINGS")
          gradle -p "$PROJECT_DIR" assembleDebug assembleRelease

      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: Flag-Battle-Royale-APKs
          path: project//build/outputs/apk//*.apk
